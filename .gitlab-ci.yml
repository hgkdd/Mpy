stages:
  - deploy

create-pages:
  image: python:3.11
  stage: deploy
  timeout: 2 hours  # Optional: Bei langen Builds

  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    MPLCONFIGDIR: "$CI_PROJECT_DIR/.cache/matplotlib"

  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
      - .cache/matplotlib

  before_script:
    - export PATH="/opt/homebrew/bin:$PATH"
    - python -m pip install --upgrade pip
    - python -m pip install -e . || echo "Package install skipped"  # Fallback
    - python -m pip install sphinx

  script:
    - mkdir -p public
    - python tools/docs_generate_api.py
    - python tools/docs_audit.py --fail-on-uncovered
    - sphinx-build -W --keep-going -E -a -b html docs/source public

  pages: true

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'