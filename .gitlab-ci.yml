stages:
  - deploy

# ============================================
# JOB 1: GitLab Pages (Dokumentation)
# ============================================
create-pages:
  stage: deploy
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    MPLCONFIGDIR: "$CI_PROJECT_DIR/.cache/matplotlib"
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
      - .cache/matplotlib
      - .ci_venv
  before_script:
    - python3 -m venv .ci_venv
    - source .ci_venv/bin/activate
    - pip3 install --upgrade pip
    - pip3 install -e .
    - pip3 install sphinx
  script:
    - mkdir -p public
    - python3 tools/docs_generate_api.py
    - python3 tools/docs_audit.py --fail-on-uncovered
    - sphinx-build -W --keep-going -E -a -b html docs/source public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ============================================
# JOB 2: TestPyPI Deployment (für RC, Dev, Alpha, Beta)
# ============================================
deploy_test_pypi:
  stage: deploy
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - python3 -m venv .ci_venv
    - source .ci_venv/bin/activate
    - pip3 install --upgrade pip
    - pip3 install build twine
  script:
    - python3 -m build
    - twine upload dist/* --repository testpypi --username __token__ --password $TEST_PYPI_TOKEN
  rules:
    # Matcht Tags wie: v1.0.0rc2, v1.0.0.dev1, v1.0.0-alpha, v1.0.0-beta1
    - if: '$CI_COMMIT_TAG =~ /(rc|dev|alpha|beta)/i'
      when: always
    - when: never
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ============================================
# JOB 3: Echte PyPI Deployment (Nur finale Releases)
# ============================================
deploy_pypi:
  stage: deploy
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key: "${CI_COMMIT_TAG}-pypi"
    paths:
      - .ci_venv
  before_script:
    - python3 -m venv .ci_venv
    - source .ci_venv/bin/activate
    - pip3 install --upgrade pip
    - pip3 install build twine
  script:
    - python3 -m build
    - twine upload dist/* --repository pypi --username __token__ --password $PYPI_TOKEN
  rules:
    # Matcht NUR saubere Tags: v1.0.0, v2.3.4 (KEIN rc, dev, alpha, beta)
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: always
    - when: never
  artifacts:
    paths:
      - dist/
    expire_in: 1 week