name: env-tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  env-test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, full]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run smoke tests
        if: matrix.suite == 'smoke'
        run: PYTHONPATH=src python test/test_env_smoke.py

      - name: Run full env refactor tests
        if: matrix.suite == 'full'
        run: PYTHONPATH=src python test/test_env_refactor_pr1_pr2.py
